# Render.com deployment configuration for the AI Weather Intelligence Platform
# https://render.com/docs/infrastructure-as-code

services:
  # ---------- Flask API Service ----------
  - type: web
    name: weather-intelligence-api
    runtime: python
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 8000
      - key: PYTHONPATH
        value: /app
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: MODEL_PATH
        value: /app/models/best_model.joblib
      - key: PREPROCESSING_METADATA_PATH
        value: /app/models/preprocessing_metadata.joblib
      - key: CLEANED_DATA_PATH
        value: /app/data/processed/cleaned_weather_dataset.csv

  # ---------- Streamlit Dashboard Service ----------
  - type: web
    name: weather-intelligence-dashboard
    runtime: python
    plan: free
    dockerfilePath: ./Dockerfile.dashboard
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: STREAMLIT_SERVER_PORT
        value: 8501
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: PYTHONPATH
        value: /app
      - key: OPENWEATHER_API_KEY
        sync: false